[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-threat-investigation"
version = "0.2.0"
description = "Explainable cloud threat investigation with signed evidence provenance"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["cryptography==50.0.2"]

[project.scripts]
cloud-threat = "cloud_threat.app:main"
cloud-evidence = "cloud_threat.core.evidence:main"
cloud-investigation-verify = "cloud_threat.workflow.exports:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cloud_threat = ["resources/*.json", "resources/*.jsonl", "resources/scenarios/*.json", "web/templates/*.html", "web/static/*.css", "web/static/*.js"]
